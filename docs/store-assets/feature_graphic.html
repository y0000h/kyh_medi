<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; }
  body {
    display: flex;
    align-items: center;
    background: linear-gradient(135deg, #fafbfe 0%, #eef3fb 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    overflow: hidden;
  }
  .pill-wrap {
    width: 420px;
    display: flex;
    justify-content: center;
    flex: none;
  }
  /* 알약: 좌 블루 / 우 화이트 (앱 아이콘 메타포) */
  .pill {
    width: 300px;
    height: 150px;
    border-radius: 999px;
    background: linear-gradient(90deg, #3D7BF5 0%, #3D7BF5 50%, #ffffff 50%, #ffffff 100%);
    box-shadow: 0 18px 40px rgba(61,123,245,0.28);
    border: 1px solid rgba(61,123,245,0.25);
    transform: rotate(-18deg);
    position: relative;
  }
  /* 가운데 분할선 */
  .pill::after {
    content: "";
    position: absolute;
    left: 50%; top: 18%;
    width: 4px; height: 64%;
    background: rgba(61,123,245,0.35);
    transform: translateX(-50%);
    border-radius: 2px;
  }
  /* 좌측 하이라이트 */
  .pill::before {
    content: "";
    position: absolute;
    left: 12%; top: 22%;
    width: 30%; height: 22%;
    background: rgba(255,255,255,0.35);
    border-radius: 999px;
    filter: blur(1px);
  }
  .text { flex: 1; padding-right: 64px; }
  .title {
    font-size: 76px;
    font-weight: 800;
    color: #1b2533;
    letter-spacing: -1px;
    line-height: 1.0;
  }
  .tagline {
    margin-top: 18px;
    font-size: 34px;
    font-weight: 700;
    color: #3D7BF5;
  }
  .sub {
    margin-top: 10px;
    font-size: 27px;
    font-weight: 500;
    color: #5a6475;
  }
</style>
</head>
<body>
  <div class="pill-wrap"><div class="pill"></div></div>
  <div class="text">
    <div class="title">KYH 약 알림</div>
    <div class="tagline">한 알도, 잊지 않게.</div>
    <div class="sub">어르신 약 알림 + 자녀 모니터링</div>
  </div>
</body>
</html>
