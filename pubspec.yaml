name: kyh_medi
description: "한 알도, 잊지 않게. 어르신용 약 알림 + 자녀 모니터링."
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 로컬 저장 (부모 진실의 원천)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # 원격 저장 + 자녀 인증
  supabase_flutter: ^2.5.0

  # FCM 푸시 (자녀)
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4

  # 상태관리 + 로컬 알림 + 시간
  provider: ^6.1.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # UI
  image_picker: ^1.1.2
  table_calendar: ^3.1.2
  intl: ^0.19.0

  # 수익화 (부모만)
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/prompts/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  background_color: "#F5F1EC"
  theme_color: "#C26644"
  adaptive_icon_background: "#F5F1EC"
  adaptive_icon_foreground: "assets/icon/icon.png"
