name: Supabase Keep-Alive

# 무료 플랜 Supabase 프로젝트는 ~7일 미사용 시 자동 일시정지(INACTIVE)되어
# 인증/Edge Function 등 모든 호출이 실패한다. 3일마다 가벼운 REST 요청을 보내
# "활동"으로 간주되게 해 일시정지를 예방한다. (anon key는 공개키라 안전)
#
# 비용: GitHub Actions 무료 한도 내(요청 1건/실행, 수 초). 추가 비용 없음.

on:
  schedule:
    - cron: '17 3 */3 * *' # UTC 기준 3일마다 03:17
  workflow_dispatch: {}     # 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (keep project active)
        env:
          SUPABASE_URL: https://evkuwuyxqyjmaargifnx.supabase.co
          # 공개 anon key (RLS 보호, 클라이언트 노출 안전 — supabase_config.dart와 동일)
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2a3V3dXl4cXlqbWFhcmdpZm54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NjUwMzUsImV4cCI6MjA5MzE0MTAzNX0.JX1SXPogrFTqAEYqlXtQKZC7kvQNLujQNwXZfvH8bsM
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/child_users?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase REST responded: HTTP $code"
          # 2xx/4xx 모두 프로젝트가 깨어있다는 신호(DB/API 도달). 5xx/000만 실패로 본다.
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            echo "::error::Supabase unreachable (HTTP $code) — 프로젝트가 정지됐을 수 있음"
            exit 1
          fi
